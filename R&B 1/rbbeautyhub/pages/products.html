<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Products | R&T Beauty Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="icon" type="image/jpeg" href="../images/logo.png">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">
      <img src="../images/logo.png" alt="R&T Beauty Hub" class="logo-img">
    </a>
    <div class="search-wrap">
      <form class="search-form" id="searchForm">
        <input type="text" class="search-input" id="searchInput" placeholder="Search for products, brands...">
        <button type="submit" class="search-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="#fff"/></svg>
        </button>
      </form>
    </div>
    <div class="header-actions">
      <a href="cart.html" class="header-action-link cart-link">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1z" fill="currentColor"/></svg>
        <span>Cart</span>
        <span class="badge" id="cartCount" style="display:none;">0</span>
      </a>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="../index.html">Home</a> <span>/</span> <span id="breadcrumbTitle">Products</span></div>
    <h1 class="page-title" id="pageTitle">All Products</h1>
  </div>
</div>

<div class="container">
  <div class="products-layout">
    <aside class="filter-sidebar">
      <div class="filter-group">
        <h4>Categories</h4>
        <label class="filter-option"><input type="checkbox" value="skincare" class="cat-filter"> Skincare</label>
        <label class="filter-option"><input type="checkbox" value="makeup" class="cat-filter"> Makeup</label>
        <label class="filter-option"><input type="checkbox" value="haircare" class="cat-filter"> Hair Care</label>
        <label class="filter-option"><input type="checkbox" value="fragrance" class="cat-filter"> Fragrance</label>
        <label class="filter-option"><input type="checkbox" value="electronics" class="cat-filter"> Electronics</label>
        <label class="filter-option"><input type="checkbox" value="fashion" class="cat-filter"> Fashion</label>
        <label class="filter-option"><input type="checkbox" value="home" class="cat-filter"> Home & Kitchen</label>
        <label class="filter-option"><input type="checkbox" value="health" class="cat-filter"> Health & Wellness</label>
      </div>
      <div class="filter-group">
        <h4>Price Range</h4>
        <div class="price-range">
          <input type="number" placeholder="Min" id="priceMin">
          <span>-</span>
          <input type="number" placeholder="Max" id="priceMax">
        </div>
        <button class="btn btn-primary btn-sm btn-full" style="margin-top:8px;" onclick="applyFilters()">Apply</button>
      </div>
      <div class="filter-group">
        <h4>Brands</h4>
        <label class="filter-option"><input type="checkbox" value="olay" class="brand-filter"> Olay</label>
        <label class="filter-option"><input type="checkbox" value="neutrogena" class="brand-filter"> Neutrogena</label>
        <label class="filter-option"><input type="checkbox" value="maybelline" class="brand-filter"> Maybelline</label>
        <label class="filter-option"><input type="checkbox" value="nike" class="brand-filter"> Nike</label>
        <label class="filter-option"><input type="checkbox" value="apple" class="brand-filter"> Apple</label>
        <label class="filter-option"><input type="checkbox" value="samsung" class="brand-filter"> Samsung</label>
      </div>
    </aside>

    <div class="products-content">
      <div class="products-toolbar">
        <span class="results-count" id="resultsCount">Showing 0 products</span>
        <select class="sort-select" id="sortSelect" onchange="applyFilters()">
          <option value="default">Sort by: Featured</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="rating">Top Rated</option>
          <option value="newest">Newest First</option>
          <option value="popular">Most Popular</option>
        </select>
      </div>
      <div class="product-grid" id="productsGrid"></div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    <div class="container">
      <div class="footer-bottom-inner">
        <p>&copy; 2026 R&T Beauty Hub. All rights reserved.</p>
      </div>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/animations.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const searchQuery = urlParams.get('q');
const categoryParam = urlParams.get('cat');
const brandParam = urlParams.get('brand');
const saleParam = urlParams.get('sale');
const sortParam = urlParams.get('sort');

// Set initial filters
if (categoryParam) {
  document.querySelectorAll('.cat-filter').forEach(cb => {
    if (cb.value === categoryParam) cb.checked = true;
  });
}
if (brandParam) {
  document.querySelectorAll('.brand-filter').forEach(cb => {
    if (cb.value === brandParam) cb.checked = true;
  });
}
if (sortParam) {
  document.getElementById('sortSelect').value = sortParam;
}

function applyFilters() {
  let products = [...getActiveProducts()];

  // Search
  if (searchQuery) {
    products = searchProducts(searchQuery);
    document.getElementById('pageTitle').textContent = `Search: "${searchQuery}"`;
    document.getElementById('breadcrumbTitle').textContent = `Search: "${searchQuery}"`;
  }

  // Category filter
  const checkedCats = [...document.querySelectorAll('.cat-filter:checked')].map(cb => cb.value);
  if (checkedCats.length > 0) {
    products = products.filter(p => checkedCats.includes(p.category));
  }

  // Brand filter
  const checkedBrands = [...document.querySelectorAll('.brand-filter:checked')].map(cb => cb.value);
  if (checkedBrands.length > 0) {
    products = products.filter(p => checkedBrands.includes(p.brand));
  }

  // Sale filter
  if (saleParam) {
    products = products.filter(p => p.originalPrice > p.price);
    document.getElementById('pageTitle').textContent = 'Deals & Offers';
    document.getElementById('breadcrumbTitle').textContent = 'Deals & Offers';
  }

  // Price range
  const min = parseInt(document.getElementById('priceMin').value) || 0;
  const max = parseInt(document.getElementById('priceMax').value) || Infinity;
  products = products.filter(p => p.price >= min && p.price <= max);

  // Sort
  const sort = document.getElementById('sortSelect').value;
  switch(sort) {
    case 'price-low': products.sort((a,b) => a.price - b.price); break;
    case 'price-high': products.sort((a,b) => b.price - a.price); break;
    case 'rating': products.sort((a,b) => b.rating - a.rating); break;
    case 'newest': products.sort((a,b) => (b.badge === 'new' ? 1 : 0) - (a.badge === 'new' ? 1 : 0)); break;
    case 'popular': products.sort((a,b) => b.reviews - a.reviews); break;
  }

  renderProductGrid('productsGrid', products);
  document.getElementById('resultsCount').textContent = `Showing ${products.length} products`;
}

// Search form
document.getElementById('searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = document.getElementById('searchInput').value.trim();
  if (q) window.location.href = `products.html?q=${encodeURIComponent(q)}`;
});

// Category filter click
document.querySelectorAll('.cat-filter, .brand-filter').forEach(cb => {
  cb.addEventListener('change', applyFilters);
});

// Initial render
applyFilters();
</script>
</body>
</html>
