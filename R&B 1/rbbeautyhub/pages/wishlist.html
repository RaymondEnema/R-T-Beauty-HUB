<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wishlist | R&T Beauty Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="icon" type="image/jpeg" href="../images/logo.png">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">
      <img src="../images/logo.png" alt="R&T Beauty Hub" class="logo-img">
    </a>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="../index.html">Home</a> <span>/</span> <span>Wishlist</span></div>
    <h1 class="page-title">My Wishlist</h1>
  </div>
</div>

<div class="container" style="padding:30px 0;">
  <div id="wishlistContent"></div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    <div class="container"><div class="footer-bottom-inner"><p>&copy; 2026 R&T Beauty Hub. All rights reserved.</p></div></div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/animations.js"></script>
<script>
function renderWishlist() {
  const container = document.getElementById('wishlistContent');
  if (wishlist.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">♡</div><h3>Your wishlist is empty</h3><p>Save your favorite items for later.</p><a href="products.html" class="btn btn-primary">Browse Products</a></div>';
    return;
  }

  const products = wishlist.map(id => getProductById(id)).filter(Boolean);
  container.innerHTML = `
    <div class="product-grid">
      ${products.map(p => {
        const discount = calculateDiscount(p.originalPrice, p.price);
        return `
          <div class="product-card">
            <div class="product-card-img">
              <a href="product.html?id=${p.id}"><img src="${p.image}" alt="${p.name}"></a>
            </div>
            <div class="product-card-body">
              <div class="product-card-cat">${p.category}</div>
              <a href="product.html?id=${p.id}" class="product-card-name">${p.name}</a>
              <div class="product-card-price">
                <span class="current-price">${formatPrice(p.price)}</span>
                <span class="original-price">${formatPrice(p.originalPrice)}</span>
                <span class="discount-pct">-${discount}%</span>
              </div>
            </div>
            <div class="product-card-footer" style="display:flex; gap:8px;">
              <button class="add-to-cart-btn" style="flex:1;" onclick="addToCart(${p.id})">Add to Cart</button>
              <button class="btn btn-outline btn-sm" onclick="removeFromWishlist(${p.id})">Remove</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function removeFromWishlist(id) {
  const idx = wishlist.indexOf(id);
  if (idx > -1) {
    wishlist.splice(idx, 1);
    localStorage.setItem('rb_wishlist', JSON.stringify(wishlist));
    updateWishlistCount();
    renderWishlist();
    showToast('Removed from wishlist');
  }
}

renderWishlist();
</script>
</body>
</html>
