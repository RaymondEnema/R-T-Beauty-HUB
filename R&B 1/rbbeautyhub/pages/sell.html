<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sell on R&T | R&T Beauty Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="icon" type="image/jpeg" href="../images/logo.png">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">
      <img src="../images/logo.png" alt="R&T Beauty Hub" class="logo-img">
    </a>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="../index.html">Home</a> <span>/</span> <span>Sell on R&T</span></div>
    <h1 class="page-title">Sell on R&T Beauty Hub</h1>
  </div>
</div>

<div class="container" style="padding:40px 0; max-width:800px;">
  <div class="checkout-section">
    <h3 style="text-align:center; margin-bottom:24px;">Start Selling Today</h3>
    <p style="text-align:center; color:#666; margin-bottom:24px;">Join thousands of sellers and reach millions of customers across Nigeria.</p>
    <form id="sellerForm">
      <div class="form-row">
        <div class="form-group">
          <label>Business Name</label>
          <input type="text" required placeholder="Your business name">
        </div>
        <div class="form-group">
          <label>Contact Person</label>
          <input type="text" required placeholder="Full name">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" required placeholder="business@email.com">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" required placeholder="08012345678">
        </div>
      </div>
      <div class="form-group">
        <label>Business Address</label>
        <input type="text" required placeholder="Full address">
      </div>
      <div class="form-group">
        <label>Product Category</label>
        <select required>
          <option value="">Select category</option>
          <option>Skincare</option>
          <option>Makeup</option>
          <option>Hair Care</option>
          <option>Fragrance</option>
          <option>Electronics</option>
          <option>Fashion</option>
          <option>Home & Kitchen</option>
          <option>Health & Wellness</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tell us about your products</label>
        <textarea rows="4" required placeholder="Describe what you sell..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Submit Application</button>
    </form>
  </div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    <div class="container"><div class="footer-bottom-inner"><p>&copy; 2026 R&T Beauty Hub. All rights reserved.</p></div></div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/animations.js"></script>
<script>
document.getElementById('sellerForm').addEventListener('submit', (e) => {
  e.preventDefault();
  showToast('Application submitted! We\'ll contact you soon.');
  e.target.reset();
});
</script>
</body>
</html>
