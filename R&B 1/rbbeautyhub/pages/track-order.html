<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track Order | R&T Beauty Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="icon" type="image/jpeg" href="../images/logo.png">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">
      <img src="../images/logo.png" alt="R&T Beauty Hub" class="logo-img">
    </a>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="../index.html">Home</a> <span>/</span> <span>Track Order</span></div>
    <h1 class="page-title">Track Your Order</h1>
  </div>
</div>

<div class="container" style="padding:40px 0; max-width:600px;">
  <div class="checkout-section">
    <h3 style="text-align:center;">Enter Your Order ID</h3>
    <form id="trackForm" style="margin-top:16px;">
      <div class="form-group">
        <input type="text" id="trackInput" required placeholder="e.g. RB12345678" style="text-align:center; font-size:16px;">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Track Order</button>
    </form>
    <div id="trackResult" style="margin-top:24px;"></div>
  </div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    <div class="container"><div class="footer-bottom-inner"><p>&copy; 2026 R&T Beauty Hub. All rights reserved.</p></div></div>
  </div>
</footer>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/animations.js"></script>
<script>
document.getElementById('trackForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const orderId = document.getElementById('trackInput').value.trim();
  const allOrders = JSON.parse(localStorage.getItem('rb_orders')) || [];
  const order = allOrders.find(o => o.id === orderId);
  const result = document.getElementById('trackResult');

  if (order) {
    const steps = ['pending', 'processing', 'shipped', 'delivered'];
    const currentStep = steps.indexOf(order.status);
    result.innerHTML = `
      <div class="checkout-section">
        <h3 style="text-align:center; color:#4CAF50;">Order Found!</h3>
        <div style="margin-top:16px;">
          <p><strong>Order ID:</strong> #${order.id}</p>
          <p><strong>Status:</strong> <span class="status-badge status-${order.status}">${order.status}</span></p>
          <p><strong>Total:</strong> ${formatPrice(order.total)}</p>
          <p><strong>Date:</strong> ${new Date(order.createdAt).toLocaleDateString()}</p>
          <div style="margin-top:16px;">
            ${steps.map((s, i) => `
              <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                <span style="width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; ${i <= currentStep ? 'background:#4CAF50; color:#fff;' : 'background:#e0e0e0; color:#999;'}">${i <= currentStep ? '✓' : ''}</span>
                <span style="${i <= currentStep ? 'color:#333;' : 'color:#999;'}">${s.charAt(0).toUpperCase() + s.slice(1)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  } else {
    result.innerHTML = '<p style="text-align:center; color:#F44336;">Order not found. Please check your order ID.</p>';
  }
});
</script>
</body>
</html>
