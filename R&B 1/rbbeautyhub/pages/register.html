<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create Account | R&T Beauty Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="icon" type="image/jpeg" href="../images/logo.png">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">
      <img src="../images/logo.png" alt="R&T Beauty Hub" class="logo-img">
    </a>
  </div>
</header>

<div class="auth-page">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="subtitle">Join R&T Beauty Hub today</p>
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="regEmail" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" required placeholder="Min 6 characters" minlength="6">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="regConfirm" required placeholder="Re-enter password">
      </div>
      <div id="regError" style="color:#F44336; font-size:13px; margin-bottom:12px;"></div>
      <button type="submit" class="btn btn-primary btn-full">Create Account</button>
    </form>
    <div class="auth-divider">OR</div>
    <a href="login.html" class="btn btn-outline btn-full">Sign In Instead</a>
    <div class="auth-footer">
      <a href="../index.html">← Back to Home</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/animations.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  const confirm = document.getElementById('regConfirm').value;

  if (password !== confirm) {
    document.getElementById('regError').textContent = 'Passwords do not match';
    return;
  }

  const result = registerUser(name, email, password);
  if (result.success) {
    showToast('Account created successfully!');
    setTimeout(() => window.location.href = '../index.html', 1000);
  } else {
    document.getElementById('regError').textContent = result.message;
  }
});
</script>
</body>
</html>
