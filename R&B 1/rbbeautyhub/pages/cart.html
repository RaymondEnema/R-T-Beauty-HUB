<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shopping Cart | R&T Beauty Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="icon" type="image/jpeg" href="../images/logo.png">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">
      <img src="../images/logo.png" alt="R&T Beauty Hub" class="logo-img">
    </a>
    <div class="header-actions">
      <a href="login.html" class="header-action-link">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/></svg>
        <span>Account</span>
      </a>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="../index.html">Home</a> <span>/</span> <span>Shopping Cart</span></div>
    <h1 class="page-title">Shopping Cart</h1>
  </div>
</div>

<div class="container cart-page">
  <div id="cartContent"></div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    <div class="container">
      <div class="footer-bottom-inner">
        <p>&copy; 2026 R&T Beauty Hub. All rights reserved.</p>
      </div>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/animations.js"></script>
<script>
function renderCart() {
  const container = document.getElementById('cartContent');

  if (cart.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🛒</div>
        <h3>Your cart is empty</h3>
        <p>Looks like you haven't added anything to your cart yet.</p>
        <a href="products.html" class="btn btn-primary">Start Shopping</a>
      </div>
    `;
    return;
  }

  const itemsHtml = cart.map(item => {
    const product = getProductById(item.id);
    if (!product) return '';
    return `
      <div class="cart-item" data-id="${item.id}">
        <div class="cart-item-img">
          <a href="product.html?id=${item.id}"><img src="${product.image}" alt="${product.name}"></a>
        </div>
        <div class="cart-item-info">
          <h3><a href="product.html?id=${item.id}">${product.name}</a></h3>
          <div class="item-price">${formatPrice(product.price)}</div>
          <div class="qty-control">
            <button class="qty-btn" onclick="updateQty(${item.id}, ${item.qty - 1})">−</button>
            <span class="qty-value">${item.qty}</span>
            <button class="qty-btn" onclick="updateQty(${item.id}, ${item.qty + 1})">+</button>
          </div>
          <button class="cart-item-remove" onclick="removeItem(${item.id})">Remove</button>
        </div>
        <div style="text-align:right;">
          <strong>${formatPrice(product.price * item.qty)}</strong>
        </div>
      </div>
    `;
  }).join('');

  const subtotal = getCartTotal();
  const shipping = 1500;
  const total = subtotal + shipping;

  container.innerHTML = `
    <div class="cart-grid">
      <div class="cart-items">${itemsHtml}</div>
      <div class="cart-summary">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal (${getCartItemCount()} items)</span><span>${formatPrice(subtotal)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>${formatPrice(shipping)}</span></div>
        <div class="promo-code">
          <input type="text" placeholder="Promo code">
          <button class="btn btn-outline btn-sm">Apply</button>
        </div>
        <div class="summary-row total"><span>Total</span><span class="amount">${formatPrice(total)}</span></div>
        <a href="checkout.html" class="btn btn-primary btn-full" style="margin-top:16px;">Proceed to Checkout</a>
        <a href="products.html" class="btn btn-outline btn-full" style="margin-top:8px;">Continue Shopping</a>
      </div>
    </div>
  `;
}

function updateQty(id, qty) {
  updateCartQty(id, qty);
  renderCart();
}

function removeItem(id) {
  removeFromCart(id);
  renderCart();
}

renderCart();
</script>
</body>
</html>
