<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Orders | R&T Beauty Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="icon" type="image/jpeg" href="../images/logo.png">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">
      <img src="../images/logo.png" alt="R&T Beauty Hub" class="logo-img">
    </a>
    <div class="header-actions">
      <a href="account.html" class="header-action-link">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/></svg>
        <span>Account</span>
      </a>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="../index.html">Home</a> <span>/</span> <span>My Orders</span></div>
    <h1 class="page-title">My Orders</h1>
  </div>
</div>

<div class="container" style="padding:30px 0;">
  <div id="ordersContent"></div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    <div class="container"><div class="footer-bottom-inner"><p>&copy; 2026 R&T Beauty Hub. All rights reserved.</p></div></div>
  </div>
</footer>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/animations.js"></script>
<script>
function renderOrders() {
  const container = document.getElementById('ordersContent');
  if (orders.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><h3>No orders yet</h3><p>Start shopping to see your orders here.</p><a href="products.html" class="btn btn-primary">Start Shopping</a></div>';
    return;
  }

  container.innerHTML = orders.map(order => `
    <div class="admin-card" style="margin-bottom:20px;">
      <div class="admin-card-header">
        <div>
          <strong>Order #${order.id}</strong>
          <span style="margin-left:12px; font-size:13px; color:#666;">${new Date(order.createdAt).toLocaleDateString()}</span>
        </div>
        <span class="status-badge status-${order.status}">${order.status.charAt(0).toUpperCase() + order.status.slice(1)}</span>
      </div>
      <div style="padding:16px 24px;">
        ${order.items.map(item => {
          const p = getProductById(item.id);
          return p ? `<div style="display:flex; gap:12px; margin-bottom:8px; align-items:center;">
            <img src="${p.image}" style="width:40px; height:40px; border-radius:4px; object-fit:cover;">
            <span style="flex:1; font-size:13px;">${p.name} × ${item.qty}</span>
            <strong style="font-size:13px;">${formatPrice(p.price * item.qty)}</strong>
          </div>` : '';
        }).join('')}
        <div style="border-top:1px solid #eee; margin-top:12px; padding-top:12px; display:flex; justify-content:space-between;">
          <span>Total</span>
          <strong style="color:#E91E63;">${formatPrice(order.total)}</strong>
        </div>
      </div>
    </div>
  `).join('');
}

renderOrders();
</script>
</body>
</html>
