<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout | R&T Beauty Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="icon" type="image/jpeg" href="../images/logo.png">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">
      <img src="../images/logo.png" alt="R&T Beauty Hub" class="logo-img">
    </a>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="../index.html">Home</a> <span>/</span> <a href="cart.html">Cart</a> <span>/</span> <span>Checkout</span></div>
    <h1 class="page-title">Checkout</h1>
  </div>
</div>

<div class="container" id="checkoutContent"></div>

<footer class="footer">
  <div class="footer-bottom">
    <div class="container">
      <div class="footer-bottom-inner">
        <p>&copy; 2026 R&T Beauty Hub. All rights reserved.</p>
      </div>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/animations.js"></script>
<script>
function renderCheckout() {
  const container = document.getElementById('checkoutContent');

  if (cart.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🛒</div><h3>Your cart is empty</h3><a href="products.html" class="btn btn-primary">Start Shopping</a></div>`;
    return;
  }

  const subtotal = getCartTotal();
  const shipping = 1500;
  const total = subtotal + shipping;
  const userName = currentUser ? currentUser.name : '';
  const userEmail = currentUser ? currentUser.email : '';

  container.innerHTML = `
    <div class="checkout-grid">
      <div>
        <div class="checkout-section">
          <h3>1. Contact Information</h3>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="checkEmail" value="${userEmail}" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="checkPhone" required placeholder="08012345678">
          </div>
        </div>

        <div class="checkout-section">
          <h3>2. Shipping Address</h3>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="checkName" value="${userName}" required placeholder="John Doe">
          </div>
          <div class="form-group">
            <label>Address</label>
            <input type="text" id="checkAddress" required placeholder="Street address">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>City</label>
              <input type="text" id="checkCity" required placeholder="Lagos">
            </div>
            <div class="form-group">
              <label>State</label>
              <select id="checkState" required>
                <option value="">Select State</option>
                <option>Lagos</option><option>Abuja</option><option>Rivers</option>
                <option>Oyo</option><option>Kano</option><option>Ogun</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Zip Code</label>
            <input type="text" id="checkZip" required placeholder="100001">
          </div>
        </div>

        <div class="checkout-section">
          <h3>3. Payment Method</h3>
          <div class="payment-options">
            <label class="payment-option selected">
              <input type="radio" name="payment" value="card" checked>
              <span>Credit/Debit Card</span>
            </label>
            <label class="payment-option">
              <input type="radio" name="payment" value="bank">
              <span>Bank Transfer</span>
            </label>
            <label class="payment-option">
              <input type="radio" name="payment" value="cod">
              <span>Cash on Delivery</span>
            </label>
          </div>

          <div id="cardFields" style="margin-top:16px;">
            <div class="form-group">
              <label>Card Number</label>
              <input type="text" placeholder="1234 5678 9012 3456" maxlength="19">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Expiry Date</label>
                <input type="text" placeholder="MM/YY" maxlength="5">
              </div>
              <div class="form-group">
                <label>CVV</label>
                <input type="text" placeholder="123" maxlength="4">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="cart-summary">
          <h3>Order Summary</h3>
          ${cart.map(item => {
            const p = getProductById(item.id);
            return p ? `
              <div style="display:flex; gap:12px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid #eee;">
                <img src="${p.image}" style="width:50px; height:50px; border-radius:4px; object-fit:cover;">
                <div style="flex:1; font-size:13px;">
                  <div style="margin-bottom:4px;">${p.name}</div>
                  <div>Qty: ${item.qty}</div>
                </div>
                <strong style="font-size:13px;">${formatPrice(p.price * item.qty)}</strong>
              </div>
            ` : '';
          }).join('')}
          <div class="summary-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>${formatPrice(shipping)}</span></div>
          <div class="summary-row total"><span>Total</span><span class="amount">${formatPrice(total)}</span></div>
          <button class="btn btn-primary btn-full" style="margin-top:16px;" onclick="placeOrder()">Place Order</button>
        </div>
      </div>
    </div>
  `;

  // Payment method toggle
  document.querySelectorAll('.payment-option').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      document.getElementById('cardFields').style.display = opt.querySelector('input').value === 'card' ? 'block' : 'none';
    });
  });
}

function placeOrder() {
  const name = document.getElementById('checkName').value;
  const email = document.getElementById('checkEmail').value;
  const phone = document.getElementById('checkPhone').value;
  const address = document.getElementById('checkAddress').value;
  const city = document.getElementById('checkCity').value;
  const state = document.getElementById('checkState').value;
  const payment = document.querySelector('input[name="payment"]:checked').value;

  if (!name || !email || !phone || !address || !city || !state) {
    showToast('Please fill all required fields', 'error');
    return;
  }

  const order = createOrder({ name, email, phone, address, city, state }, payment);
  window.location.href = `order-success.html?id=${order.id}`;
}

renderCheckout();
</script>
</body>
</html>
