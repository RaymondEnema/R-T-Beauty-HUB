<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Account | R&T Beauty Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="icon" type="image/jpeg" href="../images/logo.png">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">
      <img src="../images/logo.png" alt="R&T Beauty Hub" class="logo-img">
    </a>
    <div class="header-actions">
      <a href="cart.html" class="header-action-link cart-link">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2z" fill="currentColor"/></svg>
        <span>Cart</span>
        <span class="badge" id="cartCount" style="display:none;">0</span>
      </a>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="../index.html">Home</a> <span>/</span> <span>My Account</span></div>
    <h1 class="page-title">My Account</h1>
  </div>
</div>

<div class="container" style="padding:30px 0;">
  <div id="accountContent"></div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    <div class="container"><div class="footer-bottom-inner"><p>&copy; 2026 R&T Beauty Hub. All rights reserved.</p></div></div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/animations.js"></script>
<script>
function renderAccount() {
  const container = document.getElementById('accountContent');
  if (!currentUser) {
    container.innerHTML = '<div class="empty-state"><h3>Please sign in</h3><a href="login.html" class="btn btn-primary">Sign In</a></div>';
    return;
  }

  container.innerHTML = `
    <div class="checkout-grid">
      <div>
        <div class="checkout-section">
          <h3>Personal Information</h3>
          <form id="profileForm">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="profName" value="${currentUser.name}">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="profEmail" value="${currentUser.email}">
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" id="profPhone" value="${currentUser.phone || ''}">
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>

        <div class="checkout-section">
          <h3>Change Password</h3>
          <form id="passForm">
            <div class="form-group">
              <label>Current Password</label>
              <input type="password" id="passCurrent" required>
            </div>
            <div class="form-group">
              <label>New Password</label>
              <input type="password" id="passNew" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary">Update Password</button>
          </form>
        </div>
      </div>

      <div>
        <div class="checkout-section">
          <h3>Quick Links</h3>
          <div style="display:flex; flex-direction:column; gap:8px;">
            <a href="orders.html" class="btn btn-outline btn-full">My Orders</a>
            <a href="wishlist.html" class="btn btn-outline btn-full">My Wishlist</a>
            <a href="cart.html" class="btn btn-outline btn-full">Shopping Cart</a>
            <a href="../admin/index.html" class="btn btn-outline btn-full" style="display:${currentUser.email === 'admin@rbbeautyhub.com' ? 'block' : 'none'};">Admin Dashboard</a>
            <button class="btn btn-danger btn-full" onclick="logoutUser()">Logout</button>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('profileForm').addEventListener('submit', (e) => {
    e.preventDefault();
    currentUser.name = document.getElementById('profName').value;
    currentUser.email = document.getElementById('profEmail').value;
    currentUser.phone = document.getElementById('profPhone').value;
    localStorage.setItem('rb_user', JSON.stringify(currentUser));
    showToast('Profile updated!');
  });
}

renderAccount();
</script>
</body>
</html>
