<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign In | R&T Beauty Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="icon" type="image/jpeg" href="../images/logo.png">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">
      <img src="../images/logo.png" alt="R&T Beauty Hub" class="logo-img">
    </a>
  </div>
</header>

<div class="auth-page">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to your account</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required placeholder="Enter your password">
      </div>
      <div id="loginError" style="color:#F44336; font-size:13px; margin-bottom:12px;"></div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>
    <div class="auth-divider">OR</div>
    <a href="register.html" class="btn btn-outline btn-full">Create New Account</a>
    <div class="auth-footer">
      <a href="../index.html">← Back to Home</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/animations.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const result = loginUser(email, password);
  if (result.success) {
    showToast('Login successful!');
    setTimeout(() => window.location.href = '../index.html', 1000);
  } else {
    document.getElementById('loginError').textContent = result.message;
  }
});
</script>
</body>
</html>
