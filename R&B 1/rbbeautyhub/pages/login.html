<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign In | R&T Beauty Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="icon" type="image/jpeg" href="../images/logo.png">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">
      <img src="../images/logo.png" alt="R&T Beauty Hub" class="logo-img">
    </a>
  </div>
</header>

<div class="auth-page">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to your account</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required placeholder="Enter your password">
      </div>
      <div id="loginError" style="color:#F44336; font-size:13px; margin-bottom:12px;"></div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>
    <div class="auth-divider">OR continue with</div>
    <div class="social-login-buttons">
      <button type="button" class="social-btn google-btn" onclick="socialLogin('google')">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Google
      </button>
      <button type="button" class="social-btn microsoft-btn" onclick="socialLogin('microsoft')">
        <svg width="20" height="20" viewBox="0 0 24 24"><rect x="1" y="1" width="10" height="10" fill="#F25022"/><rect x="13" y="1" width="10" height="10" fill="#7FBA00"/><rect x="1" y="13" width="10" height="10" fill="#00A4EF"/><rect x="13" y="13" width="10" height="10" fill="#FFB900"/></svg>
        Microsoft
      </button>
      <button type="button" class="social-btn yahoo-btn" onclick="socialLogin('yahoo')">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12.1 5.5l3.1 7.4h-2l-1-2.6-1 2.6h-2.2L12.1 5.5z" fill="#6001D2"/><path d="M7.2 12.9l-3 5.2h2.3l1.7-3.1 1.7 3.1H13l-3-5.2H7.2z" fill="#6001D2"/><rect x="15.5" y="5.5" width="2" height="12.6" fill="#6001D2"/></svg>
        Yahoo
      </button>
    </div>
    <p style="text-align:center; margin-top:16px; font-size:13px;">Don't have an account? <a href="register.html" style="color:#FF6B00; font-weight:600;">Create Account</a></p>
    <div class="auth-footer">
      <a href="../index.html">← Back to Home</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/animations.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const result = loginUser(email, password);
  if (result.success) {
    showToast('Login successful!');
    setTimeout(() => window.location.href = '../index.html', 1000);
  } else {
    document.getElementById('loginError').textContent = result.message;
  }
});
</script>
</body>
</html>
